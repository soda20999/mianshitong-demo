version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: xiaozhi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: xiaozhi
      MYSQL_USER: ${MYSQL_USERNAME:?MYSQL_USERNAME must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: mumu-redis
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiaozhi-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: jdbc:mysql://mysql:3306/xiaozhi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: ${MYSQL_USERNAME:?MYSQL_USERNAME must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: xiaozhi-web
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
