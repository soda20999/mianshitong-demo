server:
  port: 8080

spring:
  application:
    name: xiaozhi
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  ai:
    openai:
      base-url: ${NVIDIA_OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${NVIDIA_API_KEY:sk-e5c20e4ef1de4a6d9e49d51b48b3e8d2}
      chat:
        completions-path: ${NVIDIA_OPENAI_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${NVIDIA_MODEL:deepseek-chat}
          temperature: ${NVIDIA_TEMPERATURE:0.2}
          max-tokens: ${NVIDIA_MAX_TOKENS:4096}
  sql:
    init:
      mode: never
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:mumu_1234987_&kP9%vL2!zQxR5*jWn8}
    access-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:15}
    refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
    expire-minutes: 720
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost}
  auth-security:
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-fail-window-minutes: ${LOGIN_FAIL_WINDOW_MINUTES:15}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    auto-migrate-legacy-passwords: ${AUTO_MIGRATE_LEGACY_PASSWORDS:true}
  ai:
    prompt-price-per-1k: ${NVIDIA_PROMPT_PRICE_PER_1K:0}
    completion-price-per-1k: ${NVIDIA_COMPLETION_PRICE_PER_1K:0}
  redis:
    interview-context-max-messages: 30
    interview-context-ttl-hours: 24
    hot-list-cache-minutes: 5
    report-queue-enabled: true
    report-task-status-ttl-hours: 72
    report-queue-poll-ms: 1000
    report-queue-batch-size: 3
